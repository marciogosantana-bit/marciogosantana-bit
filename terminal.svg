<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Terminal com objetivos atuais" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; font-size: 15px; }
      .p { fill: #39ff88; }
      .c { fill: #00f0ff; }
      .w { fill: #c9d1d9; }
      .d { fill: #5b6b86; }
      .m { fill: #ff2bd6; }
    </style>
  </defs>

  <!-- Janela -->
  <rect x="1" y="1" width="898" height="358" rx="12" fill="#0a0e17" stroke="#00f0ff" stroke-opacity="0.5"/>
  <rect x="1" y="1" width="898" height="38" rx="12" fill="#101827"/>
  <rect x="1" y="26" width="898" height="13" fill="#101827"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" class="d" style="font-size:13px">objetivos.sh — bash — ETB/DF</text>

  <!-- Linhas (loop de 14s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.03;1" dur="14s" repeatCount="indefinite"/>
    <text x="28" y="72"><tspan class="p">dev@brasilia</tspan><tspan class="w">:</tspan><tspan class="c">~</tspan><tspan class="w">$ cat objetivos_atuais.md</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.11;0.12;1" dur="14s" repeatCount="indefinite"/>
    <text x="28" y="106" class="m">## OBJETIVOS ATIVOS — 2026</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.19;1" dur="14s" repeatCount="indefinite"/>
    <text x="28" y="142"><tspan class="p">[■■■□□□□□□□]</tspan><tspan class="w">  30%  Construir meu portfólio no GitHub</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.26;1" dur="14s" repeatCount="indefinite"/>
    <text x="28" y="172"><tspan class="p">[■■■■□□□□□□]</tspan><tspan class="w">  40%  Evoluir em front-end e back-end</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.33;1" dur="14s" repeatCount="indefinite"/>
    <text x="28" y="202"><tspan class="c">[■■□□□□□□□□]</tspan><tspan class="w">  20%  1º estágio em programação (Brasília)</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.39;0.40;1" dur="14s" repeatCount="indefinite"/>
    <text x="28" y="232"><tspan class="c">[■□□□□□□□□□]</tspan><tspan class="w">  10%  Freelas: landing pages e sites p/ empresas</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.47;1" dur="14s" repeatCount="indefinite"/>
    <text x="28" y="262"><tspan class="m">[■■■□□□□□□□]</tspan><tspan class="w">  30%  Caminho até Eng. de Software na UnB</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.57;1" dur="14s" repeatCount="indefinite"/>
    <text x="28" y="300"><tspan class="d">// buscando: </tspan><tspan class="p">estágio</tspan><tspan class="d"> · </tspan><tspan class="p">remoto / home office</tspan><tspan class="d"> · </tspan><tspan class="p">freelas</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.64;1" dur="14s" repeatCount="indefinite"/>
    <text x="28" y="330"><tspan class="p">dev@brasilia</tspan><tspan class="w">:</tspan><tspan class="c">~</tspan><tspan class="w">$ </tspan><tspan class="p">status: aprendendo todo dia ✔</tspan></text>
  </g>

  <!-- Reset suave no fim do loop -->
  <rect x="2" y="40" width="896" height="318" fill="#0a0e17" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.9;0.95;0.99;1" dur="14s" repeatCount="indefinite"/>
  </rect>
</svg>
