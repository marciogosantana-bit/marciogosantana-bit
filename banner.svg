<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Banner: sistema inicializando" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="0.55" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#120a22"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace; }
      .ok { fill: #39ff88; }
      .cy { fill: #00f0ff; }
      .dim { fill: #5b6b86; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Reactor (right) -->
  <g transform="translate(1000 180)" filter="url(#glow)" opacity="0.9">
    <circle r="120" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1"/>
    <circle r="96" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="40 14 8 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="72" fill="none" stroke="#ff2bd6" stroke-width="2" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="none" stroke="#7a5cff" stroke-width="3" stroke-dasharray="90 30">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="#00f0ff">
      <animate attributeName="r" values="14;20;14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HUD corners -->
  <g fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)">
    <path d="M24 70V24H70"/>
    <path d="M1176 70V24H1130"/>
    <path d="M24 290V336H70"/>
    <path d="M1176 290V336H1130"/>
  </g>
  <text x="90" y="40" font-size="11" class="dim" letter-spacing="3">SYS://PROFILE.v2.0</text>
  <text x="1110" y="40" font-size="11" class="dim" letter-spacing="3" text-anchor="end">
    SECURE LINK
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- ============ PHASE 1: BOOT (0s → 3.9s) ============ -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.31;0.34;1" dur="12s" repeatCount="indefinite"/>

    <text x="90" y="110" font-size="16" class="cy" opacity="0">
      &gt; BOOT SEQUENCE INITIATED...
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.025;0.04;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="145" font-size="15" opacity="0">
      <tspan class="ok">[ OK ]</tspan><tspan fill="#c9d1d9"> Carregando núcleo neural</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.083;0.1;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="172" font-size="15" opacity="0">
      <tspan class="ok">[ OK ]</tspan><tspan fill="#c9d1d9"> Montando repositórios</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.142;0.158;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="199" font-size="15" opacity="0">
      <tspan class="ok">[ OK ]</tspan><tspan fill="#c9d1d9"> Sincronizando commits</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.216;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="226" font-size="15" opacity="0">
      <tspan class="ok">[ OK ]</tspan><tspan fill="#c9d1d9"> Compilando criatividade</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.258;0.275;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- progress bar -->
    <rect x="90" y="258" width="520" height="14" rx="3" fill="none" stroke="#00f0ff" stroke-opacity="0.6"/>
    <rect x="93" y="261" width="0" height="8" rx="2" fill="url(#title)" filter="url(#glow)">
      <animate attributeName="width" values="0;0;514;514" keyTimes="0;0.025;0.3;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="620" y="270" font-size="13" class="cy">LOADING...</text>
  </g>

  <!-- ============ PHASE 2: TITLE (4s → 11.5s) ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.38;0.96;1" dur="12s" repeatCount="indefinite"/>

    <text x="90" y="105" font-size="14" class="ok" letter-spacing="4">
      ● SYSTEM ONLINE
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </text>

    <!-- glitch layers -->
    <text x="90" y="190" font-size="76" font-weight="800" fill="#ff2bd6" opacity="0.55" letter-spacing="2">
      SEU NOME
      <animate attributeName="x" values="90;93;88;90;90;90;95;90" keyTimes="0;0.02;0.04;0.06;0.8;0.82;0.84;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="190" font-size="76" font-weight="800" fill="#00f0ff" opacity="0.55" letter-spacing="2">
      SEU NOME
      <animate attributeName="x" values="90;87;92;90;90;90;85;90" keyTimes="0;0.02;0.04;0.06;0.8;0.82;0.84;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="190" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="2" filter="url(#glow)">SEU NOME</text>

    <rect x="90" y="206" width="420" height="3" fill="url(#title)"/>

    <text x="90" y="245" font-size="20" fill="#c9d1d9" letter-spacing="2">DEV WEB · JAVA · HARDWARE · BRASÍLIA</text>
    <text x="90" y="278" font-size="14" class="dim">// do hardware ao código: aprendendo e construindo</text>
  </g>

  <!-- Scanlines + sweep -->
  <rect width="1200" height="360" fill="url(#scan)" pointer-events="none"/>
  <rect x="0" y="0" width="1200" height="60" fill="#00f0ff" opacity="0.05">
    <animate attributeName="y" values="-60;360" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
